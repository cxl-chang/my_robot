- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/empty/model/my_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "ignition.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/my_robot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "ignition.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/my_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "ignition.msgs.Twist"
  direction: ROS_TO_GZ

# --- Nav2 导航相关桥接（激光雷达 + 里程计） ---
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "ignition.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/odom"
  gz_topic_name: "/model/my_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "ignition.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "ignition.msgs.Image"
  direction: GZ_TO_ROS

# --- 仿真专用补丁：右指位置指令（见 gripper.gazebo.xacro 的说明）---
# gz_ros2_control 对名叫 gripper_right_finger_joint 的关节绑定错误（写不进、
# 读回来恒为 0），所以右指改由 Gazebo 自带的 JointPositionController 插件驱动，
# 由 gripper_mirror 节点把左指位置镜像过来。
- ros_topic_name: "/gripper_right_finger_cmd"
  gz_topic_name: "/gripper_right_finger_cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "ignition.msgs.Double"
  direction: ROS_TO_GZ

# --- 可选：DetachableJoint 吸附的 attach/detach（见 gripper.gazebo.xacro）---
# 只有 use_detachable:=true 时 Gazebo 侧才有这两个话题；桥接本身常驻无害。
- ros_topic_name: "/red_cube/attach"
  gz_topic_name: "/red_cube/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "ignition.msgs.Empty"
  direction: ROS_TO_GZ

- ros_topic_name: "/red_cube/detach"
  gz_topic_name: "/red_cube/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "ignition.msgs.Empty"
  direction: ROS_TO_GZ

# 吸附状态回执：插件每次成功 attach/detach 会往 output_topic 发一条空消息，
# 桥出来就能确认吸附到底有没有生效（否则只能靠肉眼在 GUI 里看方块跟不跟手）。
- ros_topic_name: "/red_cube/attached"
  gz_topic_name: "/red_cube/detachable_joint_state"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "ignition.msgs.Empty"
  direction: GZ_TO_ROS